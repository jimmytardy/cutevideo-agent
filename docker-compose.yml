name: cutevideo

networks:
  # Docker crée ce réseau en local s'il n'existe pas.
  # Sur le VPS, il réutilisera le réseau existant.
  local-network:
    driver: bridge
    name: local-network

services:
  app:
    container_name: cutevideo
    # Stack prod — ne démarre PAS en local (on utilise app-dev / worker-dev).
    # Sur le VPS : `docker compose --profile prod up -d`.
    profiles: ["prod"]
    image: cutevideo:local
    build: .
    env_file: .env
    environment:
      # Surcharge le .env (qui vise localhost:5433/6380 pour le run host) :
      # dans Docker on joint les services par leur nom DNS sur local-network.
      DATABASE_URL: postgresql+asyncpg://cutevideo:cutevideo@shared-postgres:5432/cutevideo
      REDIS_URL: redis://redis:6379
      STUDIO_SANDBOX: container
    ports:
      - "${APP_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - app_tmp:/app/tmp
      - app_output:/app/output
      # Runs Claude Studio, partagés avec le conteneur studio-sandbox (animations).
      - studio_runs:/var/lib/cutevideo/studio-runs
    networks:
      - local-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      shared-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Stack prod — ne démarre PAS en local (on utilise worker-dev). VPS : `--profile prod`.
    # Pour plusieurs workers : retirer container_name puis `docker compose up -d --scale worker=3`
    # Volumes app_tmp / app_output partagés — dimensionner le disque en conséquence.
    profiles: ["prod"]
    image: cutevideo:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cutevideo:cutevideo@shared-postgres:5432/cutevideo
      REDIS_URL: redis://redis:6379
      STUDIO_SANDBOX: container
    volumes:
      - app_tmp:/app/tmp
      - app_output:/app/output
      # Runs Claude Studio, partagés avec le conteneur studio-sandbox (animations).
      - studio_runs:/var/lib/cutevideo/studio-runs
    networks:
      - local-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["./scripts/docker-entrypoint.worker.sh"]
    # Arrêt propre (SIGTERM → Claude/ffmpeg tués, étapes marquées `interrupted`, lease libéré) avant le SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      shared-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-dev:
    container_name: cutevideo-dev
    # Même image que worker-dev (Dockerfile.dev) : construite une seule fois.
    image: cutevideo-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cutevideo:cutevideo@shared-postgres:5432/cutevideo
      REDIS_URL: redis://redis:6379
      STUDIO_SANDBOX: container
      # L'API uvicorn tourne dans le même conteneur (voir docker-entrypoint.dev.sh),
      # donc le proxy Next.js doit viser localhost, pas l'hôte.
      INTERNAL_API_URL: http://127.0.0.1:8000
      # OAuth : le navigateur ne voit pas le port 8000 (non publié) — passer par le dashboard.
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:${PORT:-3000}/api/v1/auth/google/callback
      YOUTUBE_OAUTH_REDIRECT_URI: http://localhost:${PORT:-3000}/api/v1/channels/youtube/oauth/callback
      API_BASE_URL: http://localhost:${PORT:-3000}
      SCHEDULER_ENABLED: "false"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./agent:/app/agent
      - ./studio:/app/studio
      - ./api:/app/api
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./dashboard:/app/dashboard
      - /app/dashboard/node_modules
      - /app/dashboard/.next
      - app_tmp:/app/tmp
      - app_output:/app/output
      # Runs Claude Studio, partagés avec le conteneur studio-sandbox (animations).
      - studio_runs:/var/lib/cutevideo/studio-runs
    networks:
      - local-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      shared-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-dev:
        condition: service_started

  worker-dev:
    # Scale dev : `docker compose up -d --scale worker-dev=2` (sans container_name fixe)
    # Pas de hot reload : un pipeline en cours serait tué à chaque fichier .py modifié. Après un changement de
    # code ou de .env, redéployer avec `scripts/deploy_prod_container.sh worker`.
    image: cutevideo-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cutevideo:cutevideo@shared-postgres:5432/cutevideo
      REDIS_URL: redis://redis:6379
      STUDIO_SANDBOX: container
      SCHEDULER_ENABLED: "false"
    volumes:
      - ./agent:/app/agent
      - ./studio:/app/studio
      - ./api:/app/api
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
      - ./scripts:/app/scripts
      - app_tmp:/app/tmp
      - app_output:/app/output
      # Runs Claude Studio, partagés avec le conteneur studio-sandbox (animations).
      - studio_runs:/var/lib/cutevideo/studio-runs
    networks:
      - local-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "./scripts/docker-entrypoint.worker.sh"]
    stop_grace_period: 30s
    depends_on:
      shared-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  studio-sandbox:
    # Exécute les scripts d'animation écrits par Claude (studio/sandbox.py) :
    # aucun réseau, aucun secret (pas d'env_file), utilisateur non-root.
    container_name: studio-sandbox
    image: cutevideo-sandbox:local
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    network_mode: none
    environment:
      STUDIO_SANDBOX_JOBS_DIR: /var/lib/cutevideo/studio-runs/.sandbox-jobs
    volumes:
      - studio_runs:/var/lib/cutevideo/studio-runs
      # Scripts du bac à sable montés depuis le repo (pas de rebuild à chaque modification).
      - ./studio/sandbox_exec.py:/opt/sandbox/sandbox_exec.py:ro
      - ./studio/sandbox_worker.py:/opt/sandbox/sandbox_worker.py:ro
    read_only: true
    # PID 1 = init (tini) : récolte les processus Chromium orphelins, sinon ils restent zombies et saturent
    # pids_limit en quelques dizaines de jobs (Chromium meurt alors en SIGTRAP au lancement).
    init: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256m
    # Plafonds stricts : un script d'animation ne doit jamais faire tomber le VPS (pas de swap).
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.5
    # Threads compris : un Chromium headless en consomme ~100-150.
    pids_limit: 512
    restart: unless-stopped

  # Ce bloc reste en sommeil, sauf si app-dev le réveille
  shared-postgres:
    container_name: shared-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: cutevideo
      POSTGRES_USER: cutevideo
      POSTGRES_PASSWORD: cutevideo
    ports:
      - "5432" # 🟢 CHANGEMENT ICI : On retire le "5433:" devant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutevideo -d cutevideo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379" # 🟢 CHANGEMENT ICI : On retire le "6380:" devant
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  app_tmp:
  app_output:
  studio_runs:
