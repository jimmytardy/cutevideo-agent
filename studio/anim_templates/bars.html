<!doctype html>
<!-- Modèle « bars » : comparaison en barres horizontales. PARAMS : items [{label, value}] (≤ 6), title?, unit?, theme?, accent? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/studio.js"></script>
<script>
const P = /*PARAMS*/{};
const s = Studio.scene({theme: P.theme || "night", accent: P.accent});
const D = P.duration || 3.5, items = (P.items || []).slice(0, 6);
if (P.title) s.title(P.title, {at: 0.05});
const max = Math.max(...items.map((i) => +i.value || 0)) || 1, n = items.length || 1;
const y0 = 600, gap = Math.min(190, 620 / Math.max(n - 1, 1)), stagger = Math.min(0.35, (D * 0.5) / n);
const fmt = (v) => Number(v).toLocaleString("fr-FR") + (P.unit ? " " + P.unit : "");
items.forEach((it, i) => {
  const best = +it.value === max;
  s.bar({x: 540, y: y0 + i * gap, w: 880, h: 84, labelSize: 62, value: (+it.value || 0) / max, label: it.label, valueText: fmt(it.value),
    color: best ? "accent" : "accent2", at: 0.3 + i * stagger, fillDur: 0.8});
});
</script></body></html>
