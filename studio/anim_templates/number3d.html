<!doctype html>
<!-- Modèle 3D « number3d » : chiffre extrudé qui compte jusqu'à sa valeur sur un sol brillant, caméra qui s'approche.
     Avec before : comparaison avant → après (ancien chiffre gris, nouveau en couleur, écart encadré).
     PARAMS : title?, sub?, to, from?, prefix?, suffix?, decimals?, label?, before? {value, label?}, after_label?,
     delta? ("+64 %"), theme?, accent?, floor? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/three.bundle.min.js"></script>
<script src="lib/fonts/poppins3d.typeface.js"></script>
<script src="lib/studio.js"></script>
<script src="lib/studio3d.js"></script>
<script>
const P = /*PARAMS*/{};
const D = P.duration || 4;
if (!Number.isFinite(+P.to) || P.to === "" || P.to === null) throw new Error("number3d : paramètre « to » (nombre) requis");
const s = Studio3D.scene({theme: P.theme || "night", accent: P.accent, floor: P.floor || "gloss", dof: 1, bloom: 0.3,
  camera: {pos: [0, 1.2, 9.5], target: [0, 0.75, 0], fov: 28}});
const ui = Studio.scene({theme: P.theme || "night", accent: P.accent, transparent: true});
if (P.title) ui.title(P.title, {sub: P.sub});
const fmt = {prefix: P.prefix, suffix: P.suffix, decimals: P.decimals || 0};
if (P.before) {
  // Avant (gris, à gauche, en retrait) → après (couleur, à droite, au premier plan) qui compte depuis l'avant.
  s.number({text: String(P.before.value), color: "#55555f", size: 0.6, maxW: 0.75, x: -0.62, z: -0.5, ry: 0.3, enter: "none"});
  s.number(Object.assign({}, fmt, {from: +P.before.value || 0, to: P.to, size: 0.9, maxW: 1.05, x: 0.34, ry: -0.2, at: 0,
    enter: "none", idle: "sway", countDur: Math.max(0.8, D * 0.5)}));
  if (P.before.label) ui.text(P.before.label, {x: 330, y: 1090, size: 50, weight: 600, color: "muted", at: 0.1, enter: "fade"});
  if (P.after_label) ui.text(P.after_label, {x: 660, y: 1090, size: 50, color: "ink", at: 0.6, enter: "fade"});
  // L'écart s'affiche dans la bande libre entre le titre et les chiffres (pas sur le reflet).
  if (P.delta) ui.tag(P.delta, {x: 540, y: 600, at: Math.min(D * 0.6, 2.2), size: 56, fill: "accent", enter: "pop"});
  s.ring({r: 0.62, x: 0.34, draw: Math.min(1.2, D * 0.4), at: 0.3});
} else {
  // Unité plus petite que les chiffres, nombre décollé du sol (son reflet se sépare), caméra cadrée sur sa
  // largeur finale et légèrement plongeante (l'anneau s'ouvre en ellipse au lieu de barrer les chiffres).
  const big = s.number(Object.assign({}, fmt, {suffix: "", unit: P.suffix, unitScale: 0.45, from: P.from || 0, to: P.to,
    size: 1, maxW: 1.8, y: 0.14, at: 0, enter: "none", countDur: Math.max(0.8, D * 0.6)}));
  const ppm = Math.min(820 / big.size.w, 520 / big.size.h), dist = 1920 / (2 * Math.tan(14 * Math.PI / 180) * ppm);
  const aim = [0, 0.14 + big.size.h / 2, 0];
  s.start = {pos: [-0.4, 0.4 + dist * 0.26, dist * 1.12], target: aim, fov: 28};
  s.camera({at: 0, dur: D, pos: [0.5, 0.4 + dist * 0.26, dist], target: aim});
  s.ring({r: Math.max(1.0, big.size.w / 2 + 0.3), draw: Math.min(1.2, D * 0.4)});
  if (P.label) ui.text(P.label, {x: 540, y: 1100, size: 58, at: Math.min(D * 0.45, 1.6), enter: "up", maxW: 900});
}
s.particles({count: 50});
// Seul, le chiffre est plus petit qu'un couple avant/après : la caméra s'en approche davantage.
if (P.before) s.push({at: 0, dur: D, from: 9.5, to: 8.6, target: [0, 0.6, 0]});
</script></body></html>
