<!doctype html>
<!-- Modèle « counter » : chiffre qui défile jusqu'à sa valeur. PARAMS : to, from?, prefix?, suffix?, label?, decimals?, icon?, theme?, accent? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/studio.js"></script>
<script>
const P = /*PARAMS*/{};
const s = Studio.scene({theme: P.theme || "night", accent: P.accent});
const D = P.duration || 3;
if (P.icon) s.icon(P.icon, {x: 540, y: 470, size: 320, at: 0.05, enter: "pop", idle: "float"});
s.circle({x: 540, y: P.icon ? 860 : 760, r: 380, stroke: "accent", width: 10, opacity: 0.25, at: 0, enter: "grow", dur: Math.max(0.6, D * 0.6)});
s.counter({x: 540, y: P.icon ? 860 : 760, from: P.from || 0, to: P.to || 0, prefix: P.prefix, suffix: P.suffix, decimals: P.decimals || 0,
  size: 190, at: 0.1, countDur: Math.max(0.6, D * 0.65), enter: "pop"});
if (P.label) s.text(P.label, {x: 540, y: P.icon ? 1130 : 1050, size: 64, at: D * 0.45, enter: "up", maxW: 940});
</script></body></html>
