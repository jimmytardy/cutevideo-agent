<!doctype html>
<!-- Modèle « before_after » : avant / après avec balayage. PARAMS : title?, before {label, icon?, caption?}, after {…}, theme?, accent? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/studio.js"></script>
<script>
const P = /*PARAMS*/{};
const s = Studio.scene({theme: P.theme || "night", accent: P.accent});
const D = P.duration || 4, mid = Math.max(1.2, D * 0.48);
if (P.title) s.title(P.title, {at: 0.05});
const block = (o, at, out, color) => {
  if (!o) return;
  if (o.icon) s.icon(o.icon, {x: 540, y: 740, size: 420, at, out, enter: "pop", exit: "pop"});
  s.tag(o.label || "", {x: 540, y: 470, at, out, size: 52, fill: color, enter: "down", exit: "up"});
  if (o.caption) s.text(o.caption, {x: 540, y: 1090, size: 62, at: at + 0.2, out, enter: "up", exit: "fade"});
};
block(P.before, 0.25, mid, "muted");
s.flash({at: mid + 0.05, dur: 0.22});
block(P.after, mid + 0.15, undefined, "accent");
</script></body></html>
