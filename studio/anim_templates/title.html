<!doctype html>
<!-- Modèle « title » : titre qui apparaît mot par mot. PARAMS : text (mots entre * en couleur d'accent), subtitle?, theme?, accent? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/studio.js"></script>
<script>
const P = /*PARAMS*/{};
const s = Studio.scene({theme: P.theme || "night", accent: P.accent});
const D = P.duration || 3;
const words = String(P.text || "").split(/\s+/).filter(Boolean);
// Lignes d'environ 12 caractères, taille adaptée au nombre de lignes.
const lines = [[]]; let len = 0;
for (const w of words) { const n = w.replace(/\*/g, "").length; if (len && len + n > 12) { lines.push([]); len = 0; } lines[lines.length - 1].push(w); len += n + 1; }
const size = lines.length > 3 ? 104 : 128, step = Math.min(0.22, (D * 0.5) / Math.max(words.length, 1));
s.custom((g, el, th) => {
  const spans = []; let inAcc = false;
  lines.forEach((ln, i) => {
    const t = el("text", {x: 0, y: (i - (lines.length - 1) / 2) * size * 1.12, "text-anchor": "middle", "dominant-baseline": "middle", "font-weight": 900, "font-size": size, filter: "url(#shadow)"}, g);
    ln.forEach((w, j) => {
      // `*` ouvre / ferme une zone en couleur d'accent (peut couvrir plusieurs mots).
      const starts = w.startsWith("*"), ends = /\*[.,!?:;…]*$/.test(w.slice(1)) || (w.length > 1 && w.endsWith("*") && !starts);
      if (starts) inAcc = true;
      const sp = el("tspan", {fill: inAcc ? th.accent : th.ink}, t);
      if (ends || (starts && /\*[.,!?:;…]*$/.test(w.slice(1)))) inAcc = false;
      sp.textContent = w.replace(/\*/g, "") + (j < ln.length - 1 ? " " : "");
      spans.push(sp);
    });
  });
  return (lt) => spans.forEach((sp, i) => sp.setAttribute("opacity", Math.min(1, Math.max(0, (lt - i * step) / 0.15))));
}, {x: 540, y: 760, enter: "none", dur: 0.01});
if (P.subtitle) s.text(P.subtitle, {x: 540, y: 760 + (lines.length / 2) * size * 1.12 + 70, size: 58, weight: 800, color: "accent", at: Math.min(D * 0.6, words.length * step + 0.2), enter: "up", maxW: 940});
</script></body></html>
