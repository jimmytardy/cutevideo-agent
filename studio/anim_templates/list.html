<!doctype html>
<!-- Modèle « list » : points ou étapes de chronologie révélés un à un. PARAMS : items [str] (≤ 6), title?, numbered?, theme?, accent? -->
<html><head><meta charset="utf-8"></head><body>
<script src="lib/studio.js"></script>
<script>
const P = /*PARAMS*/{};
const s = Studio.scene({theme: P.theme || "night", accent: P.accent});
const D = P.duration || 3.5, items = (P.items || []).slice(0, 6), n = Math.max(items.length, 1);
if (P.title) s.title(P.title, {at: 0.05});
const y0 = 560, gap = Math.min(150, 640 / Math.max(n - 1, 1)), step = Math.min(0.5, (D * 0.7) / n);
items.forEach((txt, i) => {
  const y = y0 + i * gap, at = 0.3 + i * step;
  s.tag(P.numbered ? String(i + 1) : "•", {x: 140, y, at, fill: "accent", size: 60, enter: "pop"});
  s.text(String(txt), {x: 220, y, anchor: "start", size: n > 4 ? 62 : 74, maxW: 760, at: at + 0.08, enter: "left"});
});
</script></body></html>
